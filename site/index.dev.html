<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sanghak.kr 메일</title>
    <meta name="description" content="sanghak.kr 도메인 웹메일" />
    <meta name="theme-color" content="#c2510a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./config.dev.js"></script>
  </head>
  <body>
    <!-- 로그인 -->
    <section id="login">
      <div class="login-bg" aria-hidden="true"></div>

      <form class="login-card" id="login-form" novalidate>
        <div class="login-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
            <path d="M3 5.5 12 13l9-7.5" />
          </svg>
        </div>

        <h1>sanghak.kr 메일</h1>
        <p class="sub">아이디와 비밀번호로 로그인하세요.</p>

        <div class="field">
          <label for="login-id">아이디</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6" />
            </svg>
            <input id="login-id" name="id" autocomplete="username"
                   placeholder="admin" required autofocus />
          </div>
        </div>

        <div class="field">
          <label for="login-pw">비밀번호</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2" />
              <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
            </svg>
            <input id="login-pw" name="password" type="password"
                   autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="peek" id="toggle-pw"
                    aria-label="비밀번호 표시">보기</button>
          </div>
        </div>

        <button class="btn btn-primary btn-block login-submit" type="submit" id="login-btn">
          로그인
        </button>

        <p class="error" id="login-error" role="alert" aria-live="polite"></p>
      </form>

      <p class="login-foot">sanghak.kr · Cloudflare Workers</p>
    </section>

    <!-- 메일함 -->
    <main id="app" class="hidden">
      <aside>
        <div class="brand">
          <div>
            <strong>메일 시스템</strong>
            <div class="who" id="who"></div>
          </div>
          <button class="btn" id="logout" title="로그아웃">나가기</button>
        </div>

        <button class="btn btn-primary btn-block" id="compose-btn">새 메일 쓰기</button>

        <div class="nav-group">
          <h3>폴더</h3>
          <div id="folders"></div>
        </div>

        <div class="nav-group">
          <h3>메일 주소</h3>
          <div id="mailboxes"></div>
          <button class="nav-item" id="add-mailbox">
            <span class="name">+ 주소 추가</span>
          </button>
        </div>
      </aside>

      <section class="list-pane">
        <div class="toolbar">
          <input type="search" id="search" placeholder="메일 검색" />
          <button class="btn" id="refresh" title="새로고침">↻</button>
        </div>
        <div id="list"></div>
      </section>

      <section class="read-pane">
        <div id="reader">
          <div class="empty">읽을 메일을 선택하세요.</div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
