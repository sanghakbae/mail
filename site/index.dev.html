<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sanghak.kr 메일</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./config.dev.js"></script>
  </head>
  <body>
    <!-- 로그인 -->
    <section id="login">
      <form class="login-card" id="login-form">
        <h1>sanghak.kr 메일</h1>
        <p class="sub">아이디와 비밀번호로 로그인</p>
        <div class="field">
          <label for="login-id">아이디</label>
          <input id="login-id" name="id" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-pw">비밀번호</label>
          <input id="login-pw" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">로그인</button>
        <p class="error" id="login-error"></p>
      </form>
    </section>

    <!-- 메일함 -->
    <main id="app" class="hidden">
      <aside>
        <div class="brand">
          <div>
            <strong>sanghak.kr</strong>
            <div class="who" id="who"></div>
          </div>
          <button class="btn" id="logout" title="로그아웃">나가기</button>
        </div>

        <button class="btn btn-primary btn-block" id="compose-btn">새 메일 쓰기</button>

        <div class="nav-group">
          <h3>폴더</h3>
          <div id="folders"></div>
        </div>

        <div class="nav-group">
          <h3>메일 주소</h3>
          <div id="mailboxes"></div>
          <button class="nav-item" id="add-mailbox">
            <span class="name">+ 주소 추가</span>
          </button>
        </div>
      </aside>

      <section class="list-pane">
        <div class="toolbar">
          <input type="search" id="search" placeholder="메일 검색" />
          <button class="btn" id="refresh" title="새로고침">↻</button>
        </div>
        <div id="list"></div>
      </section>

      <section class="read-pane">
        <div id="reader">
          <div class="empty">읽을 메일을 선택하세요.</div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
