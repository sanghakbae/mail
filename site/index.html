<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>sanghak.kr 메일</title>
    <meta name="description" content="sanghak.kr 도메인 웹메일" />
    <meta name="application-name" content="상학 메일" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="상학 메일" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css?v=dev" />
    <script src="./config.js?v=dev"></script>
  </head>
  <body>
    <div class="network-banner" id="network-banner" role="status" aria-live="polite" hidden>
      오프라인 상태입니다. 연결되면 메일을 다시 불러올 수 있어요.
    </div>
    <!-- 로그인 -->
    <section id="login">
      <div class="login-bg" aria-hidden="true"></div>

      <form class="login-card" id="login-form" novalidate>
        <div class="login-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
            <path d="M3 5.5 12 13l9-7.5" />
          </svg>
        </div>

        <h1>메일 시스템</h1>
        <p class="sub">sanghak.kr 웹메일에 로그인하세요.</p>

        <div class="field">
          <label for="login-id">아이디</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="3.5" />
              <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6" />
            </svg>
            <input id="login-id" name="id" autocomplete="username" required autofocus />
          </div>
        </div>

        <div class="field">
          <label for="login-pw">비밀번호</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="9.5" rx="2" />
              <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
            </svg>
            <input id="login-pw" name="password" type="password"
                   autocomplete="current-password" required />
            <button type="button" class="peek" id="toggle-pw" aria-label="비밀번호 표시">보기</button>
          </div>
        </div>

        <button class="btn btn-primary btn-block login-submit" type="submit" id="login-btn">
          로그인
        </button>

        <button class="pwa-guide hidden" type="button" id="pwa-guide">
          <strong>상학 메일을 앱처럼 사용하세요</strong>
          <span>홈 화면에 추가하면 브라우저 없이 빠르게 메일을 확인할 수 있습니다.</span>
          <span class="pwa-guide-action">홈 화면에 추가하는 방법 →</span>
        </button>

        <p class="error" id="login-error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <!-- 메일함 -->
    <main id="app" class="hidden">
      <div class="scrim" id="scrim" hidden></div>

      <aside id="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
              <path d="M3 5.5 12 13l9-7.5" />
            </svg>
          </span>
          <span class="brand-text">
            <strong>메일 시스템</strong>
            <span class="who" id="who"></span>
          </span>
          <button class="icon-btn drawer-only" id="drawer-close" aria-label="닫기">✕</button>
        </div>

        <button class="btn btn-primary compose-btn" id="compose-btn">새 메일 쓰기</button>

        <nav class="nav-group" id="folders" aria-label="폴더"></nav>

        <div class="nav-group">
          <h3>받는 주소</h3>
          <div id="mailboxes"></div>
          <button class="nav-item nav-add" id="add-mailbox">
            <span class="name">+ 주소 추가</span>
          </button>
        </div>

        <div class="sidebar-foot">
          <button class="nav-item hidden" id="install-app"><span class="name">앱 설치</span></button>
          <button class="nav-item" id="open-admin"><span class="name">관리자</span></button>
          <button class="nav-item" id="logout"><span class="name">로그아웃</span></button>
        </div>
      </aside>

      <section class="list-pane">
        <header class="topbar">
          <button class="icon-btn drawer-only" id="menu-btn" aria-label="메뉴">☰</button>
          <div class="search-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" />
            </svg>
            <input type="search" id="search" placeholder="메일 검색" />
          </div>
          <button class="icon-btn" id="refresh" aria-label="새로고침">↻</button>
        </header>

        <div class="bulkbar" id="bulkbar" hidden>
          <label class="check" title="모두 선택">
            <input type="checkbox" id="check-all" />
          </label>
          <span class="bulk-count" id="bulk-count"></span>
          <div class="bulk-actions" id="bulk-actions"></div>
        </div>

        <div class="list-header">
          <h2 id="list-title">받은 메일</h2>
          <span class="sub" id="list-sub"></span>
        </div>

        <div id="list"></div>
      </section>

      <section class="read-pane" id="read-pane">
        <div id="reader">
          <div class="empty">
            <p>읽을 메일을 선택하세요.</p>
            <p class="hint">j / k 로 이동, Enter 로 열기, e 보관, # 휴지통</p>
          </div>
        </div>
      </section>

      <button class="fab" id="fab-compose" aria-label="새 메일 쓰기">✎</button>
    </main>

    <script src="./app.js?v=dev"></script>
  </body>
</html>
